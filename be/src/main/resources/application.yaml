spring:
  application:
    name: BE

  datasource:
    url: ${app.datasource.url}
    username: ${app.datasource.username}
    password: ${app.datasource.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS}

push:
  enabled: ${PUSH_ENABLED:false}
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:}

# Independent of Web Push; optional Expo enhanced-security token is server-only.
mobile-push:
  enabled: ${MOBILE_PUSH_ENABLED:false}
  access-token: ${EXPO_PUSH_ACCESS_TOKEN:}

# HTTP wire/header and SQL bind logging can disclose subscription credentials.
logging:
  level:
    org.apache.http: OFF
    nl.martijndwars.webpush: OFF
    org.jose4j: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF

# Only the aggregate health status is exposed, including outside prod.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
